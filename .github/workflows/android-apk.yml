name: Android APK

on:
  push:
    branches: [main, codex/arena-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier explicitement un APK depuis main'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:v2
      - run: npm run test:v3
      - run: npm run test:v4
      - run: npm run preview:build
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - name: Régressions navigateur via HTTP
        run: |
          node tools/serve-preview.mjs > /tmp/tka-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173/index.html > /dev/null && break
            sleep 1
          done
          BROWSER_TEST_URL=http://127.0.0.1:5173/index.html npm run test:browser
      - run: npm run test:browser:v2
      - run: npm run test:pwa
      - name: Chrome Android — démarrage, rotation et perte de contexte
        run: npm run test:browser:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webgl-diagnostics
          path: .preview/android-startup/
      - name: Rétrécissement — HDR fini et adaptation sans image noire
        run: npm run test:browser:narrowing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrowing-webgl-diagnostics
          path: .preview/narrowing/
      - name: Construire la référence V3 publiée pour les captures réelles
        run: |
          git fetch --no-tags origin 4c8fcb57bfc1d1bf5ed3eda5963107a018767831
          mkdir -p .preview/v3
          git archive 4c8fcb57bfc1d1bf5ed3eda5963107a018767831 | tar -x -C .preview/v3
          ln -s "$GITHUB_WORKSPACE/node_modules" .preview/v3/node_modules
          cd .preview/v3
          node tools/build-preview.mjs
      - name: Comparaisons V3 / chantier V4 et régressions garage
        run: node tools/visual-v4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-v4-real-renders
          path: .preview/comparison/
      - run: npx expo prebuild --platform android --no-install
      - name: "Build APK (release, signé avec la clé debug : installable directement)"
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk turbo-karts-arena.apk
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-karts-arena-apk
          path: turbo-karts-arena.apk
      - name: Publier dans les Releases
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Turbo Karts Arena – APK Android
          files: turbo-karts-arena.apk
          prerelease: true
