name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK (release, signé avec la clé debug : installable directement)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk turbo-karts-arena.apk
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-karts-arena-apk
          path: turbo-karts-arena.apk
      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Turbo Karts Arena – APK Android
          files: turbo-karts-arena.apk
          prerelease: true
